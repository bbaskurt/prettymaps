[project]
name = "peracolor-prettymaps"
version = "0.1.0"
description = "PeraColor circle city map posters and Etsy listing generator, built on prettymaps"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "geopandas<0.14",
    "loguru>=0.7.3",
    "matplotlib<3.9",
    "numpy<1.27",
    "osmnx==1.2.2",
    "pandas<2.1",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2",
    "pyyaml==6.0.*",
    "requests>=2.34.2",
    "shapely>=1.8,<2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
