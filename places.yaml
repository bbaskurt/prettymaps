# PeraColor places. Each entry becomes one Etsy listing.
#
# `centre` is set explicitly for every place: it keeps circles inland, because
# OpenStreetMap maps the sea only as coastline lines (not polygons), so open sea
# would render as a flat, oddly clipped area. Rivers, lakes and canals are fine.
# `query` documents the place; rendering uses `centre` directly (offline, no geocoding).
# `osm_region` is the Geofabrik extract containing the place (download.geofabrik.de).
# Sorted alphabetically by slug.
